<!doctype html>
<!--
  One line, said plainly, on the navy ground. For stories, reel covers and
  posts that are a thought rather than a feature. Drop "night" from the body
  for a white ground (and "tile" from the brand with it).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ad-size" content="1080x1920">
  <link rel="stylesheet" href="/marketing/templates/ad.css">
</head>
<body class="story night">
  <main class="ad">
    <div class="panes"><span></span><span></span><span></span><span></span></div>

    <div class="grow"></div>

    <h1 class="headline big">The treasurer’s report, <span class="accent">done.</span></h1>
    <div style="height: 56px"></div>
    <p class="sub">A monthly statement made for you, ready for the council.</p>

    <div class="grow"></div>

    <div class="brand tile"><img src="/public/ekkly-mark.svg" alt=""><span class="name">Ekkly</span></div>
    <div style="height: 28px"></div>
    <p class="link">ekkly.online</p>
  </main>
  <script src="/marketing/templates/ad.js"></script>
</body>
</html>
