<!doctype html>
<!--
  One app, one benefit, three wins. The workhorse layout.
  Copy into marketing/ads/<folder>/, then change the app artwork, the words
  and the icons. Swap body class "feed" for "square" or "story" to resize, and
  the meta to match.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ad-size" content="1080x1350">
  <link rel="stylesheet" href="/marketing/templates/ad.css">
</head>
<body class="feed">
  <main class="ad">
    <div class="plate-row">
      <div class="plate"><img src="/src/assets/app-icons/members.svg" alt=""></div>
      <p class="kicker">People</p>
    </div>

    <div class="grow"></div>

    <h1 class="headline">Everyone’s details, one tap away</h1>

    <div style="height: 64px"></div>

    <ul class="wins">
      <li><span class="chip"><i data-icon="phone"></i></span>Find anyone’s number in seconds</li>
      <li><span class="chip"><i data-icon="users-three"></i></span>See who serves where</li>
      <li><span class="chip"><i data-icon="cake"></i></span>Never miss a birthday</li>
    </ul>

    <div class="grow"></div>

    <div class="foot">
      <div class="brand"><img src="/public/ekkly-mark.svg" alt=""><span class="name">Ekkly</span></div>
      <span class="cta">Ask for your church</span>
    </div>
  </main>
  <script src="/marketing/templates/ad.js"></script>
</body>
</html>
