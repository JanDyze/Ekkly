<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ad-size" content="1080x1350">
  <link rel="stylesheet" href="/marketing/templates/ad.css">
</head>
<body class="feed">
  <main class="ad">
    <div class="plate-row">
      <div class="plate"><img src="/src/assets/app-icons/lineups.svg" alt=""></div>
      <p class="kicker">Schedules &amp; Presentation</p>
    </div>

    <div class="grow"></div>

    <h1 class="headline">Sunday without the scramble</h1>

    <div style="height: 64px"></div>

    <ul class="wins">
      <li><span class="chip"><i data-icon="identification-badge"></i></span>Everyone knows their role</li>
      <li><span class="chip"><i data-icon="projector-screen"></i></span>Songs go straight to the screen</li>
      <li><span class="chip"><i data-icon="chats-circle"></i></span>No more rosters in group chats</li>
    </ul>

    <div class="grow"></div>

    <div class="foot">
      <div class="brand"><img src="/public/ekkly-mark.svg" alt=""><span class="name">Ekkly</span></div>
      <span class="cta">Ask for your church</span>
    </div>
  </main>
  <script src="/marketing/templates/ad.js"></script>

</html>
